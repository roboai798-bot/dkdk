<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>BLAST MAZE 3D ─ 一人称ボム迷路アクション</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#120e22;color:#fff;font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
.hud{position:fixed;pointer-events:none;font-weight:800;text-shadow:2px 2px 0 #000,0 0 6px rgba(0,0,0,.6);z-index:5}
#hudTL{left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:5px;font-size:14px}
#hudTL .lab{font-size:10px;letter-spacing:.18em;color:#ffd27a;margin-right:6px}
#hearts span{color:#ff4f6e;font-size:17px;margin-right:2px}
#hearts span.off{color:#3a2030}
#stats{display:flex;gap:10px;font-size:14px;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:8px;width:max-content}
#info{font-size:12px;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:8px;width:max-content}
#info b.open{color:#4dffb0}#info b.seal{color:#ff7a8a}#info b.unk{color:#aaa}
#hudTC{left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#timeV{font-size:24px;letter-spacing:.06em;background:rgba(0,0,0,.4);padding:2px 12px;border-radius:10px}
#timeV.warn{color:#ff5a5a;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#btnPause{pointer-events:auto;width:38px;height:38px;border-radius:10px;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.45);color:#fff;font:900 15px sans-serif;cursor:pointer}
#map{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));border:2px solid rgba(255,255,255,.55);border-radius:6px;background:#000;z-index:5;cursor:pointer;opacity:.92;image-rendering:pixelated}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(0,0,0,.4);pointer-events:none;z-index:4}
#vign{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 45%,rgba(255,20,20,.75) 100%)}
#dangerTxt{position:fixed;left:50%;top:62%;transform:translateX(-50%);font:900 22px sans-serif;color:#ff3b3b;letter-spacing:.2em;text-shadow:0 0 8px #000,2px 2px 0 #000;pointer-events:none;z-index:6;opacity:0}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff;z-index:7}
#msg{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;z-index:8;opacity:0;transition:opacity .25s}
#msg .big{font:900 44px "Segoe UI",sans-serif;letter-spacing:.08em;color:#ffe14a;text-shadow:3px 3px 0 #b3261e,6px 6px 0 #000}
#msg .sub{font:800 18px sans-serif;margin-top:8px;text-shadow:2px 2px 0 #000}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;text-align:center;font:700 14px sans-serif;background:rgba(10,8,30,.72);border:1px solid rgba(255,255,255,.3);padding:7px 14px;border-radius:10px;pointer-events:none;z-index:8;opacity:0;transition:opacity .3s}
#hint{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:10px;font:600 11px sans-serif;color:rgba(255,255,255,.75);text-shadow:1px 1px 0 #000;pointer-events:none;z-index:4;line-height:1.5}
/* ---- touch ---- */
#touchLayer{position:fixed;inset:0;z-index:2;display:none;touch-action:none}
body.touch #touchLayer{display:block}
body.touch #hint{display:none}
#stickBase{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(255,255,255,.08);pointer-events:none;z-index:9;display:none}
#stickKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 10px rgba(0,0,0,.5)}
#stickHint{position:fixed;left:calc(70px + env(safe-area-inset-left));bottom:calc(70px + env(safe-area-inset-bottom));width:110px;height:110px;margin:0 0 -55px -55px;border-radius:50%;border:2px dashed rgba(255,255,255,.3);pointer-events:none;z-index:3;display:none;font:700 10px sans-serif;color:rgba(255,255,255,.5);text-align:center;line-height:110px}
body.touch.playing #stickHint{display:block}
.tbtn{position:fixed;z-index:9;display:none;border:3px solid rgba(255,255,255,.7);color:#fff;font:900 15px sans-serif;text-shadow:1px 1px 0 #000;touch-action:none;-webkit-user-select:none;user-select:none}
body.touch.playing .tbtn{display:block}
#tBomb{right:calc(20px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a6a,#d2142a 60%,#7a0010);font-size:17px}
#tBomb:active,#tBomb.press{transform:scale(.93);filter:brightness(1.3)}
#tTL,#tTR{width:58px;height:58px;border-radius:16px;background:rgba(20,30,70,.6);font-size:24px}
#tTL{right:calc(128px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom))}
#tTR{right:calc(20px + env(safe-area-inset-right));bottom:calc(134px + env(safe-area-inset-bottom))}
#tTL.press,#tTR.press{filter:brightness(1.5)}
/* ---- screens ---- */
#scr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,6,20,.62);padding:16px;overflow:auto}
#scr.on{display:flex}
#panel{max-width:560px;width:100%;max-height:100%;overflow:auto;background:linear-gradient(#24204a,#151230);border:3px solid #ffd24a;border-radius:18px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center}
#panel h1{margin:0;font:900 40px "Segoe UI",sans-serif;letter-spacing:.06em;color:#ffe14a;text-shadow:3px 3px 0 #c2261e,5px 5px 0 #000}
#panel h2{margin:0 0 6px;font:900 32px sans-serif;color:#ffe14a;text-shadow:3px 3px 0 #000}
#panel .tag{font-weight:700;color:#ffb36a;margin:4px 0 12px;letter-spacing:.1em}
#panel p{margin:6px 0;line-height:1.55;font-size:14px}
#panel .rules{text-align:left;font-size:13px;line-height:1.6;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 12px;margin:10px 0}
#panel .rules b{color:#ffd27a}
#panel kbd{display:inline-block;min-width:20px;padding:0 5px;border:1px solid #aaa;border-bottom-width:3px;border-radius:5px;font:700 11px monospace;background:#2c2858;margin:0 1px}
#scrBtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.btn{font:900 17px sans-serif;padding:12px 22px;border-radius:12px;border:3px solid #fff;background:#3b3570;color:#fff;cursor:pointer;min-width:150px}
.btn.pri{background:linear-gradient(#ff5a3c,#c71a2a);border-color:#ffe14a}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.96)}
#sndBtn{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:21;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer;display:none}
#scr.on ~ #sndBtn{display:block}
@media (max-width:600px),(max-height:500px){
  #msg .big{font-size:32px}
  #panel h1{font-size:30px}
  #panel{padding:14px}
  #hudTL{font-size:12px}
  #stats{font-size:12px}
  #timeV{font-size:19px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touchLayer"></div>
<div id="vign"></div>
<div id="flash"></div>
<div id="cross"></div>
<div id="dangerTxt">⚠ 爆風圏内 ⚠</div>

<div id="hudTL" class="hud">
  <div><span class="lab">STAGE</span><span id="stageV">1</span>　<span id="hearts"></span></div>
  <div><span class="lab">SCORE</span><span id="scoreV">0</span></div>
  <div id="stats"><span>💣 <span id="bombV">1/1</span></span><span>🔥 <span id="fireV">2</span></span><span>👟 <span id="spdV">0</span></span></div>
  <div id="info">敵 <span id="enemyV">0</span> ｜ 出口 <b id="exitV" class="unk">未発見</b></div>
</div>
<div id="hudTC" class="hud"><span id="timeV">3:00</span><button id="btnPause" title="ポーズ (P / Esc)">II</button></div>
<canvas id="map" width="135" height="117" title="タップ / M で拡大"></canvas>
<div id="msg"><div class="big" id="msgBig"></div><div class="sub" id="msgSub"></div></div>
<div id="toast"></div>
<div id="hint"><kbd>W</kbd><kbd>S</kbd>/<kbd>↑</kbd><kbd>↓</kbd> 前後　<kbd>A</kbd><kbd>D</kbd> 横歩き　<kbd>←</kbd><kbd>→</kbd> 旋回　<kbd>Q</kbd><kbd>E</kbd> 90°ターン<br><kbd>Space</kbd> ボム設置　<kbd>M</kbd> マップ拡大　<kbd>P</kbd> ポーズ　画面クリックでマウス視点（任意）</div>

<div id="stickBase"><div id="stickKnob"></div></div>
<div id="stickHint">MOVE / TURN</div>
<button id="tTL" class="tbtn">⟲</button>
<button id="tTR" class="tbtn">⟳</button>
<button id="tBomb" class="tbtn">BOMB</button>

<div id="scr" class="on"><div id="panel"><div id="scrBody"><h1>BLAST MAZE 3D</h1><p class="tag">LOADING…</p></div><div id="scrBtns"></div></div></div>
<button id="sndBtn" title="サウンド切替">🔊</button>

<script>
'use strict';
/* =========================================================
   BLAST MAZE 3D  ─ 一人称ボム迷路アクション
   ========================================================= */
const $=id=>document.getElementById(id);
const W=15,H=13,N=W*H;
const EMPTY=0,HARD=1,SOFT=2;
const FUSE=3.0, FLAME_T=0.6, BURN_T=0.45, STAGE_TIME=180;
const EYE=0.64, PR=0.27;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const idx=(x,z)=>z*W+x;
const inb=(x,z)=>x>=0&&z>=0&&x<W&&z<H;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ITEM_DEF={
  bomb:{name:'ボム +1',col:'#2f6bff'},
  fire:{name:'火力 +1',col:'#ff4a1a'},
  speed:{name:'スピード +1',col:'#17b35a'},
  life:{name:'ライフ +1',col:'#ff3f97'}
};
const ENEMY_DEF={
  balloon:{name:'プカリン',col:0xff6fb5,score:100,speed:1.05,chase:false,ghost:false},
  spike:{name:'トゲボール',col:0xff9a1f,score:200,speed:1.65,chase:true,ghost:false},
  ghost:{name:'スリヌケ',col:0x6fe8ff,score:400,speed:0.95,chase:true,ghost:true}
};

let renderer,scene,camera,levelGroup,clock;
let T=0, state='loading', stateT=0, pausedFrom=null;
const grid=new Uint8Array(N), burnT=new Float32Array(N), flameAt=new Float32Array(N), danger=new Float32Array(N);
let hidden=new Array(N).fill(null), softMesh=new Array(N).fill(null), bombAt=new Array(N).fill(null), itemAt=new Array(N).fill(null);
let bombs=[], flames=[], enemies=[], debris=[], exitObj=null;
let stage=1, timeLeft=STAGE_TIME, best=0;
const P={x:1,z:1,yaw:-Math.PI/2,pitch:-0.08,snap:0,maxBombs:1,range:2,speedLv:0,lives:3,score:0,bob:0,moving:0};
let shake=0, tickT=0, alarmT=0, timeWarned=false, allDeadNotified=false;
let G={}, M={}, TX={};
let dangerMesh, lights=[], flamePool=[], viewBomb;
let mapBig=false;
const VB={x:0.3,y:-0.26};
let touchMode=false;

try{best=+localStorage.getItem('blastmaze3d_best')||0;}catch(e){}

/* ================= AUDIO (Web Audio API) ================= */
let AC=null,master=null,sfxBus=null,bgmBus=null,noiseBuf=null,soundOn=true;
function unlockAudio(){
  if(!AC){
    try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    const comp=AC.createDynamicsCompressor();
    master=AC.createGain();master.gain.value=soundOn?0.9:0;
    master.connect(comp);comp.connect(AC.destination);
    sfxBus=AC.createGain();sfxBus.connect(master);
    bgmBus=AC.createGain();bgmBus.gain.value=0.32;bgmBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended')AC.resume();
}
function panNode(pan){
  if(!AC)return null;
  if(pan&&AC.createStereoPanner){const p=AC.createStereoPanner();p.pan.value=clamp(pan,-1,1);p.connect(sfxBus);return p;}
  return sfxBus;
}
function tone(f,d,o={}){
  if(!AC)return;
  const t0=o.at!==undefined?o.at:AC.currentTime+(o.t||0);
  const os=AC.createOscillator(),g=AC.createGain();
  os.type=o.type||'square';os.frequency.setValueAtTime(f,t0);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const v=o.vol||0.15,a=o.attack||0.005;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  os.connect(g);g.connect(o.dest||sfxBus);os.start(t0);os.stop(t0+d+0.05);
}
function noise(d,o={}){
  if(!AC)return;
  const t0=o.at!==undefined?o.at:AC.currentTime+(o.t||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const fl=AC.createBiquadFilter();fl.type=o.ftype||'lowpass';fl.frequency.setValueAtTime(o.f||2000,t0);fl.Q.value=o.q||1;
  if(o.f2)fl.frequency.exponentialRampToValueAtTime(o.f2,t0+d);
  const g=AC.createGain();const v=o.vol||0.3;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.attack||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  s.connect(fl);fl.connect(g);g.connect(o.dest||sfxBus);
  s.start(t0,Math.random()*1.0);s.stop(t0+d+0.05);
}
const S={
  click(){tone(880,0.06,{vol:0.08,type:'triangle'});},
  place(){tone(190,0.12,{to:80,vol:0.25});noise(0.05,{vol:0.2,f:3000,ftype:'highpass'});tone(1300,0.05,{t:0.06,vol:0.07,type:'sine'});},
  deny(){tone(160,0.12,{vol:0.12,type:'sawtooth'});tone(120,0.12,{t:0.1,vol:0.12,type:'sawtooth'});},
  tick(urgent,inDanger){const f=inDanger?1900:(urgent?1500:1150);tone(f,0.04,{vol:inDanger?0.14:0.07,type:'sine'});},
  explode(dist,pan){
    const v=clamp(1.15/(1+dist*0.22),0.12,1),dst=panNode(pan);
    noise(1.0,{vol:0.9*v,f:4200,f2:160,dest:dst});
    noise(0.35,{vol:0.5*v,f:900,f2:120,dest:dst,q:2});
    tone(110,0.6,{to:32,vol:0.6*v,type:'sine',dest:dst});
  },
  brk(dist,pan){const v=clamp(1/(1+dist*0.25),0.15,1),dst=panNode(pan);noise(0.22,{vol:0.45*v,ftype:'bandpass',f:1800,f2:500,q:1.4,dest:dst,t:0.05});tone(420,0.18,{to:140,vol:0.15*v,type:'triangle',dest:dst,t:0.05});},
  item(){[660,880,1175,1568].forEach((f,i)=>tone(f,0.09,{t:i*0.06,vol:0.12}));},
  life(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.12,{t:i*0.07,vol:0.12,type:'triangle'}));},
  enemy(){tone(900,0.3,{to:160,vol:0.16});noise(0.15,{vol:0.2,f:2500,t:0.02});},
  reveal(){tone(1047,0.12,{vol:0.1,type:'triangle'});tone(1568,0.25,{t:0.1,vol:0.1,type:'triangle'});},
  exitOpen(){[784,988,1175,1568,1976].forEach((f,i)=>tone(f,0.25,{t:i*0.09,vol:0.11,type:'triangle'}));},
  alarm(){tone(1250,0.07,{vol:0.1,type:'square'});tone(950,0.07,{t:0.08,vol:0.1,type:'square'});},
  timeWarn(){tone(1000,0.15,{vol:0.12});tone(1000,0.15,{t:0.25,vol:0.12});},
  miss(){tone(700,0.15,{to:500,vol:0.2});tone(500,0.2,{t:0.15,to:300,vol:0.2});tone(300,0.6,{t:0.35,to:70,vol:0.22,type:'sawtooth'});noise(0.5,{vol:0.3,f:1500,f2:100});},
  start(){[523,659,784,1047].forEach((f,i)=>tone(f,0.14,{t:i*0.11,vol:0.13}));tone(1047,0.4,{t:0.45,vol:0.12,type:'triangle'});},
  clear(){const n=[523,659,784,659,784,1047,1319,1568];n.forEach((f,i)=>tone(f,i===n.length-1?0.6:0.13,{t:i*0.12,vol:0.13}));n.forEach((f,i)=>tone(f/2,0.13,{t:i*0.12,vol:0.08,type:'triangle'}));},
  over(){[392,370,349,330,262].forEach((f,i)=>tone(f,i===4?0.9:0.32,{t:i*0.3,vol:0.15,type:'triangle'}));}
};
/* --- light BGM sequencer --- */
let bgmNext=0,bgmStep=0;
const BASS=[45,45,57,45,48,45,52,43, 45,45,57,45,55,53,52,50, 41,41,53,41,45,41,48,40, 43,43,55,43,47,43,50,47];
const LEAD={0:69,3:72,6:76,8:74,12:72,14:69,16:65,19:69,22:72,24:71,27:74,30:79};
const mf=n=>440*Math.pow(2,(n-69)/12);
function bgmTick(){
  if(!AC||!soundOn||state!=='play')return;
  const spb=60/138/2;
  if(bgmNext<AC.currentTime-0.2)bgmNext=AC.currentTime+0.05;
  while(bgmNext<AC.currentTime+0.15){
    const s=bgmStep%32,t=bgmNext;
    tone(mf(BASS[s]),spb*0.9,{at:t,vol:0.16,type:'triangle',dest:bgmBus});
    if(s%2===1)noise(0.04,{at:t,vol:0.06,ftype:'highpass',f:7000,dest:bgmBus});
    if(s%8===0)tone(150,0.12,{at:t,to:50,vol:0.25,type:'sine',dest:bgmBus});
    if(LEAD[s]&&Math.floor(bgmStep/32)%2===1)tone(mf(LEAD[s]),spb*1.6,{at:t,vol:0.05,type:'square',dest:bgmBus});
    bgmNext+=spb;bgmStep++;
  }
}
function setSound(on){soundOn=on;if(master)master.gain.value=on?0.9:0;$('sndBtn').textContent=on?'🔊':'🔇';}
$('sndBtn').onclick=e=>{e.stopPropagation();unlockAudio();setSound(!soundOn);};

/* ================= TEXTURES ================= */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,rep){const t=new THREE.CanvasTexture(c);t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}return t;}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function floorTex(){
  const c=cv(256,256),g=c.getContext('2d');
  for(let i=0;i<2;i++)for(let j=0;j<2;j++){
    g.fillStyle=(i+j)%2?'#4a8a3c':'#579a46';g.fillRect(i*128,j*128,128,128);
    for(let k=0;k<260;k++){g.fillStyle=`rgba(${20+Math.random()*50|0},${70+Math.random()*70|0},${20+Math.random()*30|0},.45)`;g.fillRect(i*128+Math.random()*128,j*128+Math.random()*128,2,2+Math.random()*3);}
    g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=3;g.strokeRect(i*128+1.5,j*128+1.5,125,125);
  }
  return c;
}
function stoneTex(base,hi,lo){
  const c=cv(128,128),g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,128,128);
  for(let k=0;k<500;k++){const v=Math.random()*40-20|0;g.fillStyle=`rgba(${128+v},${128+v},${140+v},.12)`;g.fillRect(Math.random()*128,Math.random()*128,3,3);}

/* ================= STAGE ================= */
function aliveEnemies(){let n=0;for(const e of enemies)if(!e.dying)n++;return n;}
function exitOpen(){return exitObj&&exitObj.revealed&&aliveEnemies()===0;}
function buildStage(){
  for(const f of flames)f.m.parent&&f.m.parent.remove(f.m),flamePool.push(f.m);
  flames.length=0;
  for(const c of levelGroup.children.slice()){levelGroup.remove(c);}
  for(let i=0;i<N;i++){if(softMesh[i]&&softMesh[i].userData.burnMat)softMesh[i].userData.burnMat.dispose();}
  bombs.length=0;enemies.length=0;debris.length=0;
  grid.fill(0);burnT.fill(0);flameAt.fill(0);danger.fill(99);
  hidden.fill(null);softMesh.fill(null);bombAt.fill(null);itemAt.fill(null);
  for(const l of lights)l.intensity=0;

  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
    if(x===0||z===0||x===W-1||z===H-1||(x%2===0&&z%2===0))grid[idx(x,z)]=HARD;
  }
  const safe=new Set([idx(1,1),idx(2,1),idx(3,1),idx(1,2),idx(1,3)]);
  const dens=Math.min(0.42+stage*0.03,0.64);
  const softs=[];
  for(let z=1;z<H-1;z++)for(let x=1;x<W-1;x++){
    const i=idx(x,z);if(grid[i]!==EMPTY||safe.has(i))continue;
    if(Math.random()<dens){grid[i]=SOFT;softs.push([x,z]);}
  }
  // exit (hidden under a far soft block)
  const far=softs.filter(s=>s[0]+s[1]>=12);
  const ex=(far.length?far:softs)[Math.random()*(far.length?far.length:softs.length)|0];
  hidden[idx(ex[0],ex[1])]='exit';
  const em=makeExit();em.position.set(ex[0],0,ex[1]);em.visible=false;levelGroup.add(em);
  exitObj={x:ex[0],z:ex[1],revealed:false,mesh:em,wasOpen:false};
  // items
  let list=stage===1?['bomb','fire','speed','bomb','fire']:['bomb','fire','speed'];
  if(stage>1){for(let i=0;i<2+Math.min(2,stage>>2);i++)list.push(['bomb','fire','speed'][Math.random()*3|0]);if(Math.random()<0.5)list.push('life');}
  const cand=softs.filter(s=>!hidden[idx(s[0],s[1])]);
  for(const it of list){if(!cand.length)break;const k=Math.random()*cand.length|0;const s=cand.splice(k,1)[0];hidden[idx(s[0],s[1])]=it;}
  // soft meshes
  for(const s of softs){const m=new THREE.Mesh(G.soft,M.soft);m.position.set(s[0],0.46,s[1]);levelGroup.add(m);softMesh[idx(s[0],s[1])]=m;}
  // enemies
  const cnt=Math.min(2+stage,10);
  const spots=[];
  for(let z=1;z<H-1;z++)for(let x=1;x<W-1;x++)if(grid[idx(x,z)]===EMPTY&&(x-1)+(z-1)>=7)spots.push([x,z]);
  for(let i=0;i<cnt&&spots.length;i++){
    const r=Math.random();let type='balloon';
    if(stage>=2&&r<0.3+stage*0.05)type='spike';
    if(stage>=3&&r<0.12+stage*0.025)type='ghost';
    const s=spots.splice(Math.random()*spots.length|0,1)[0];
    const d=ENEMY_DEF[type];
    const e={type,cx:s[0],cz:s[1],tx:s[0],tz:s[1],prog:0,dx:0,dz:0,wait:Math.random()*0.8,
      speed:Math.min(d.speed+stage*0.04,type==='spike'?2.5:1.8),chase:d.chase,ghost:d.ghost,x:s[0],z:s[1],
      mesh:makeEnemyMesh(type),dying:0,ph:Math.random()*6};
    e.mesh.position.set(s[0],0.38,s[1]);levelGroup.add(e.mesh);enemies.push(e);
  }
  // player
  P.x=1;P.z=1;P.yaw=-Math.PI/2;P.pitch=-0.08;P.snap=0;P.bob=0;
  timeLeft=STAGE_TIME;timeWarned=false;allDeadNotified=false;shake=0;tickT=0;
  camera.rotation.set(0,0,0);
}

/* ================= BOMBS & BLAST ================= */
function playerBombCount(){return bombs.length;}
function placeBomb(){
  if(state!=='play')return;
  const cx=Math.round(P.x),cz=Math.round(P.z),i=idx(cx,cz);
  if(!inb(cx,cz)||grid[i]!==EMPTY||bombAt[i])return;
  if(playerBombCount()>=P.maxBombs){S.deny();toast('ボムは同時に '+P.maxBombs+' 個まで！（💣アイテムで増える）');return;}
  const m=makeBombMesh();m.position.set(cx,0,cz);levelGroup.add(m);
  const b={x:cx,z:cz,t:FUSE,range:P.range,passable:true,mesh:m,dead:false,eff:FUSE};
  bombs.push(b);bombAt[i]=b;S.place();
  // enemies heading into this cell turn back
}
function blastCells(b){
  const out=[[b.x,b.z]];
  for(const d of DIRS){
    for(let r=1;r<=b.range;r++){
      const x=b.x+d[0]*r,z=b.z+d[1]*r;if(!inb(x,z))break;
      const g=grid[idx(x,z)];if(g===HARD)break;
      out.push([x,z]);
      if(g===SOFT||bombAt[idx(x,z)])break;
    }
  }
  return out;
}
function explode(b){
  if(b.dead)return;b.dead=true;
  const cells=blastCells(b);
  bombs.splice(bombs.indexOf(b),1);bombAt[idx(b.x,b.z)]=null;levelGroup.remove(b.mesh);
  b.mesh.userData.mat.dispose();b.mesh.userData.spr.material.dispose();
  for(const [x,z] of cells){
    const i=idx(x,z);
    const f=getFlame();f.position.set(x,0.43,z);f.rotation.y=Math.random()*0.3;
    flames.push({x,z,t:FLAME_T,m:f,ph:Math.random()*6});
    flameAt[i]=Math.max(flameAt[i],FLAME_T);
    if(grid[i]===SOFT)destroySoft(x,z);
    const ob=bombAt[i];if(ob&&!ob.dead)ob.t=Math.min(ob.t,0.09);
  }
  // light, sound, shake
  let L=lights[0];for(const l of lights)if(l.intensity<L.intensity)L=l;
  L.position.set(b.x,0.8,b.z);L.intensity=3.2;
  const dx=b.x-P.x,dz=b.z-P.z,dist=Math.hypot(dx,dz);
  const rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
  const pan=dist>0.3?(dx*rx+dz*rz)/dist*0.8:0;
  S.explode(dist,pan);
  shake=Math.max(shake,0.22/(1+dist*0.45));
  if(dist<3.5)flash('#ffb050',0.35/(1+dist));
}
function destroySoft(x,z){
  const i=idx(x,z);if(burnT[i]>0)return;
  burnT[i]=BURN_T;P.score+=10;
  const m=softMesh[i];
  if(m){const bm=M.soft.clone();bm.emissive=new THREE.Color(0xff5a10);m.material=bm;m.userData.burnMat=bm;}
  const dx=x-P.x,dz=z-P.z,dist=Math.hypot(dx,dz);
  S.brk(dist,dist>0.3?(dx*Math.cos(P.yaw)-dz*Math.sin(P.yaw))/dist*0.8:0);
  for(let k=0;k<8;k++){
    const d=new THREE.Mesh(G.debris,M.debris);d.position.set(x+rnd(-0.3,0.3),rnd(0.2,0.8),z+rnd(-0.3,0.3));
    levelGroup.add(d);debris.push({m:d,vx:rnd(-2.5,2.5),vy:rnd(2,5),vz:rnd(-2.5,2.5),t:rnd(0.7,1.1),rx:rnd(-8,8),rz:rnd(-8,8)});
  }
}
function finishSoft(i){
  grid[i]=EMPTY;const m=softMesh[i];
  if(m){levelGroup.remove(m);if(m.userData.burnMat)m.userData.burnMat.dispose();softMesh[i]=null;}
  const h=hidden[i];hidden[i]=null;
  const x=i%W,z=(i/W)|0;
  if(h==='exit'){
    exitObj.revealed=true;exitObj.mesh.visible=true;S.reveal();
    if(aliveEnemies()===0){setExitLook(true);exitObj.wasOpen=true;S.exitOpen();banner('出口が開いた！','光の柱へ向かえ');}
    else{setExitLook(false);toast('出口を発見！ 敵を全滅させると開くぞ');}
  }else if(h){
    const m2=makeItemMesh(h);m2.position.set(x,0.35,z);levelGroup.add(m2);
    itemAt[i]={type:h,x,z,m:m2,age:0};
  }
}

/* ================= UPDATE ================= */
const K={};
function inputVec(){
  let f=0,s=0,t=0;
  if(K.KeyW||K.ArrowUp)f+=1;if(K.KeyS||K.ArrowDown)f-=1;
  if(K.KeyA)s-=1;if(K.KeyD)s+=1;
  if(K.ArrowLeft)t+=1;if(K.ArrowRight)t-=1;
  if(stickId!==null){
    const dz=0.14;
    let sy=-stickY,sx=stickX;
    if(Math.abs(sy)>dz)f+=(sy-Math.sign(sy)*dz)/(1-dz);
    if(Math.abs(sx)>dz){const v=(Math.abs(sx)-dz)/(1-dz);t-=Math.sign(sx)*v*v*1.15;}
  }
  return {f:clamp(f,-1,1),s:clamp(s,-1,1),t:clamp(t,-1.2,1.2)};
}
function solidP(x,z){
  if(!inb(x,z))return true;const i=idx(x,z);
  if(grid[i]!==EMPTY)return true;
  const b=bombAt[i];return !!(b&&!b.passable);
}
function overlapCell(px,pz,r,x,z){
  const qx=clamp(px,x-0.5,x+0.5),qz=clamp(pz,z-0.5,z+0.5);
  const dx=px-qx,dz=pz-qz;return dx*dx+dz*dz<r*r;
}
function resolve(px,pz){
  for(let it=0;it<3;it++){
    const cx=Math.round(px),cz=Math.round(pz);
    for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
      const x=cx+dx,z=cz+dz;if(!solidP(x,z))continue;
      const qx=clamp(px,x-0.5,x+0.5),qz=clamp(pz,z-0.5,z+0.5);
      let ddx=px-qx,ddz=pz-qz;const d2=ddx*ddx+ddz*ddz;
      if(d2<PR*PR){
        if(d2>1e-9){const d=Math.sqrt(d2),k=(PR-d)/d;px+=ddx*k;pz+=ddz*k;}
        else{ // centre inside the box: push out along the shortest axis
          const ox=px-x,oz=pz-z;
          if(Math.abs(ox)>Math.abs(oz))px=x+Math.sign(ox||1)*(0.5+PR);else pz=z+Math.sign(oz||1)*(0.5+PR);
        }
      }
    }
  }
  return [px,pz];
}
function updatePlayer(dt){
  const iv=inputVec();
  P.yaw+=iv.t*2.5*dt;
  if(P.snap!==0){const st=Math.sign(P.snap)*Math.min(Math.abs(P.snap),9*dt);P.yaw+=st;P.snap-=st;}
  const sp=2.5+P.speedLv*0.38;
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  let vx=-sy*iv.f+cy*iv.s,vz=-cy*iv.f-sy*iv.s;
  const len=Math.hypot(vx,vz);if(len>1){vx/=len;vz/=len;}
  let nx=P.x+vx*sp*dt,nz=P.z+vz*sp*dt;
  // lane assist: gently centre the player in corridors so corners don't snag
  if(len>0.05){
    const ax=Math.abs(vx),az=Math.abs(vz);
    if(ax>az*1.3){const t=Math.round(nz),off=t-nz;if(Math.abs(off)<0.45&&!solidP(Math.round(nx+Math.sign(vx)*0.6),t))nz+=Math.sign(off)*Math.min(Math.abs(off),sp*dt*0.75*ax);}
    else if(az>ax*1.3){const t=Math.round(nx),off=t-nx;if(Math.abs(off)<0.45&&!solidP(t,Math.round(nz+Math.sign(vz)*0.6)))nx+=Math.sign(off)*Math.min(Math.abs(off),sp*dt*0.75*az);}
  }
  [nx,nz]=resolve(nx,nz);
  const moved=Math.hypot(nx-P.x,nz-P.z);
  P.x=nx;P.z=nz;
  P.moving=moved/dt>0.4?1:0;
  P.bob+=dt*(P.moving?9+P.speedLv:0);
  // bombs become solid once the player has stepped off them
  for(const b of bombs)if(b.passable&&!overlapCell(P.x,P.z,PR,b.x,b.z))b.passable=false;
  // items
  const ci=idx(Math.round(P.x),Math.round(P.z));
  const it=itemAt[ci];
  if(it&&Math.hypot(P.x-it.x,P.z-it.z)<0.5)pickItem(it);
  // exit
  if(exitOpen()&&Math.hypot(P.x-exitObj.x,P.z-exitObj.z)<0.38){stageClear();return;}
  // flame
  if(flameAt[ci]>0){killPlayer('爆風に巻き込まれた！');return;}
  // enemy contact
  for(const e of enemies)if(!e.dying&&Math.hypot(e.x-P.x,e.z-P.z)<0.56){killPlayer(ENEMY_DEF[e.type].name+' にやられた！');return;}
}
function pickItem(it){
  const i=idx(it.x,it.z);itemAt[i]=null;levelGroup.remove(it.m);it.m.material.dispose();
  P.score+=50;
  if(it.type==='bomb')P.maxBombs=Math.min(P.maxBombs+1,8);
  if(it.type==='fire')P.range=Math.min(P.range+1,8);
  if(it.type==='speed')P.speedLv=Math.min(P.speedLv+1,5);
  if(it.type==='life'){P.lives=Math.min(P.lives+1,9);S.life();}else S.item();
  toast('⭐ '+ITEM_DEF[it.type].name+' ！');
  flash(ITEM_DEF[it.type].col,0.25);
}
function enemyCan(e,x,z,avoid){
  if(!inb(x,z))return false;const i=idx(x,z),g=grid[i];
  if(g===HARD)return false;if(g===SOFT&&!e.ghost)return false;
  if(bombAt[i])return false;
  if(avoid&&(danger[i]<1.3||flameAt[i]>0))return false;
  return true;
}
function enemyChoose(e){
  let opts=DIRS.filter(d=>enemyCan(e,e.cx+d[0],e.cz+d[1],e.chase));
  if(!opts.length)opts=DIRS.filter(d=>enemyCan(e,e.cx+d[0],e.cz+d[1],false));
  if(!opts.length){e.tx=e.cx;e.tz=e.cz;e.wait=0.35;return;}
  let pick=null;
  if(e.chase){
    const dist=Math.abs(P.x-e.cx)+Math.abs(P.z-e.cz);
    if(dist<8&&Math.random()<0.6){
      let bd=1e9;for(const d of opts){const v=Math.abs(P.x-e.cx-d[0])+Math.abs(P.z-e.cz-d[1]);if(v<bd){bd=v;pick=d;}}
    }
  }
  if(!pick){
    const same=opts.find(d=>d[0]===e.dx&&d[1]===e.dz);
    if(same&&Math.random()<0.72)pick=same;
    else{
      const nb=opts.filter(d=>!(d[0]===-e.dx&&d[1]===-e.dz));
      const pool=nb.length&&Math.random()<0.85?nb:opts;pick=pool[Math.random()*pool.length|0];
    }
  }
  e.dx=pick[0];e.dz=pick[1];e.tx=e.cx+pick[0];e.tz=e.cz+pick[1];e.prog=0;
}
function updateEnemies(dt){
  for(let k=enemies.length-1;k>=0;k--){
    const e=enemies[k];
    if(e.dying){
      e.dying-=dt;const s=Math.max(0.01,e.dying/0.6);
      e.mesh.scale.setScalar(s);e.mesh.rotation.y+=dt*14;e.mesh.position.y+=dt*0.8;
      if(e.dying<=0){levelGroup.remove(e.mesh);e.mesh.userData.mat.dispose();enemies.splice(k,1);}
      continue;
    }
    if(e.wait>0){e.wait-=dt;if(e.wait<=0)enemyChoose(e);}
    else if(e.tx===e.cx&&e.tz===e.cz)enemyChoose(e);
    else{
      if(!enemyCan(e,e.tx,e.tz,false)){ // something (a bomb) appeared ahead → turn back
        if(enemyCan(e,e.cx,e.cz,false)){const ox=e.cx,oz=e.cz;e.cx=e.tx;e.cz=e.tz;e.tx=ox;e.tz=oz;e.prog=1-e.prog;e.dx*=-1;e.dz*=-1;}
      }else{
        e.prog+=e.speed*dt;
        if(e.prog>=1){e.cx=e.tx;e.cz=e.tz;e.prog=0;enemyChoose(e);}
      }
    }
    e.x=e.cx+(e.tx-e.cx)*e.prog;e.z=e.cz+(e.tz-e.cz)*e.prog;
    e.ph+=dt*(e.type==='balloon'?3:6);
    e.mesh.position.set(e.x,0.38+Math.sin(e.ph)*0.06,e.z);
    if(e.dx||e.dz){const ty=Math.atan2(e.dx,e.dz);let d=ty-e.mesh.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));e.mesh.rotation.y+=d*Math.min(1,dt*10);}
    if(e.type==='spike')e.mesh.rotation.z=Math.sin(e.ph)*0.15;
    // blast
    const ci=idx(Math.round(e.x),Math.round(e.z));
    if(flameAt[ci]>0){
      e.dying=0.6;P.score+=ENEMY_DEF[e.type].score;S.enemy();
      if(aliveEnemies()===0)onAllEnemiesDown();
    }
  }
}
function onAllEnemiesDown(){
  if(exitObj.revealed){setExitLook(true);exitObj.wasOpen=true;S.exitOpen();banner('出口が開いた！','緑の光の柱へ向かえ');}
  else if(!allDeadNotified){allDeadNotified=true;toast('敵を全滅させた！ ソフトブロックの下に隠れた出口を探そう');}
}
function updateBombs(dt){
  for(const b of bombs.slice()){
    b.t-=dt;
    if(b.t<=0){explode(b);continue;}
    const u=b.mesh.userData,k=1-b.t/FUSE;
    const pulse=0.5+0.5*Math.sin(T*(6+k*26));
    u.mat.emissive.setRGB(0.6*pulse*(0.3+k),0.05*pulse,0);
    const s=1+0.06*pulse+k*0.08;b.mesh.children[0].scale.setScalar(s);
    u.sp.scale.setScalar(0.7+Math.random()*0.9);
    const n=Math.max(1,Math.min(3,Math.ceil(b.t)));
    if(u.spr.material.map!==TX.num[n]){u.spr.material.map=TX.num[n];u.spr.material.needsUpdate=true;}
    u.spr.scale.setScalar(0.3+0.06*pulse);
  }
}
function updateFlames(dt){
  flameAt.fill(0);
  for(let k=flames.length-1;k>=0;k--){
    const f=flames[k];f.t-=dt;
    if(f.t<=0){levelGroup.remove(f.m);flamePool.push(f.m);flames.splice(k,1);continue;}
    const p=1-f.t/FLAME_T;
    const s=p<0.12?0.3+p/0.12*0.7:1-(p-0.12)/0.88*0.75;
    f.ph+=dt*30;
    f.m.scale.set(s*(0.92+0.08*Math.sin(f.ph)),s*(0.9+0.15*Math.sin(f.ph*1.3)),s*(0.92+0.08*Math.cos(f.ph)));
    const i=idx(f.x,f.z);flameAt[i]=Math.max(flameAt[i],f.t);
  }
}
function updateBurn(dt){
  for(let i=0;i<N;i++){
    if(burnT[i]<=0)continue;
    burnT[i]-=dt;const m=softMesh[i];
    if(m){const p=1-burnT[i]/BURN_T;m.scale.set(1-p*0.5,1-p*0.8,1-p*0.5);m.position.y=0.46*(1-p*0.8);if(m.userData.burnMat)m.userData.burnMat.emissive.setRGB(1,0.35+Math.random()*0.3,0.05);}
    if(burnT[i]<=0){burnT[i]=0;finishSoft(i);}
  }
}
function updateItems(dt){
  for(let i=0;i<N;i++){
    const it=itemAt[i];if(!it)continue;
    it.age+=dt;it.m.rotation.y+=dt*2;it.m.position.y=0.35+Math.sin(T*3+i)*0.06;
    if(flameAt[i]>0&&it.age>0.4){ // items burn up if hit by a later blast
      itemAt[i]=null;levelGroup.remove(it.m);it.m.material.dispose();
      for(let k=0;k<5;k++){const d=new THREE.Mesh(G.debris,M.flameI);d.position.set(it.x,0.4,it.z);levelGroup.add(d);debris.push({m:d,vx:rnd(-2,2),vy:rnd(1,3),vz:rnd(-2,2),t:0.5,rx:4,rz:4});}
    }
  }
  if(exitObj&&exitObj.revealed){
    const u=exitObj.mesh.userData;u.ring.rotation.z+=dt*(exitOpen()?3:0.6);
    u.beam.scale.set(1+0.1*Math.sin(T*5),1,1+0.1*Math.sin(T*5));
  }
}
function updateDebris(dt){
  for(let k=debris.length-1;k>=0;k--){
    const d=debris[k];d.t-=dt;
    if(d.t<=0){levelGroup.remove(d.m);debris.splice(k,1);continue;}
    d.vy-=14*dt;d.m.position.x+=d.vx*dt;d.m.position.y+=d.vy*dt;d.m.position.z+=d.vz*dt;
    if(d.m.position.y<0.07){d.m.position.y=0.07;d.vy*=-0.35;d.vx*=0.6;d.vz*=0.6;}
    d.m.rotation.x+=d.rx*dt;d.m.rotation.z+=d.rz*dt;d.m.scale.setScalar(Math.min(1,d.t*2));
  }
  for(const l of lights)if(l.intensity>0)l.intensity=Math.max(0,l.intensity-dt*6);
}
let _c=null,_dd=null;
const dangerOn=new Array(N).fill(false);
function updateDanger(){
  if(!_c){_c=new THREE.Color();_dd=new THREE.Object3D();}
  danger.fill(99);
  for(const b of bombs)b.eff=b.t;
  const cellsOf=bombs.map(b=>blastCells(b));
  for(let it=0;it<4;it++){ // chain reactions: a bomb inherits the earliest time of any blast reaching it
    for(let a=0;a<bombs.length;a++)for(const [x,z] of cellsOf[a]){const o=bombAt[idx(x,z)];if(o&&o!==bombs[a]&&o.eff>bombs[a].eff)o.eff=bombs[a].eff;}
  }
  for(let a=0;a<bombs.length;a++)for(const [x,z] of cellsOf[a]){const i=idx(x,z);if(bombs[a].eff<danger[i])danger[i]=bombs[a].eff;}
  for(let i=0;i<N;i++){
    let on=true;
    if(flameAt[i]>0)_c.setRGB(1,0.55,0.1);
    else if(danger[i]<99){
      const k=clamp(1-danger[i]/FUSE,0,1),pulse=0.5+0.5*Math.sin(T*(7+k*20));
      const v=0.45+0.3*k+0.25*pulse;
      _c.setRGB(v,0.04+0.12*pulse*k,0.04);
    }else on=false;
    if(on!==dangerOn[i]){ // hide safe tiles by collapsing them
      dangerOn[i]=on;_dd.position.set(i%W,0.012,(i/W)|0);_dd.scale.setScalar(on?1:0.0001);_dd.updateMatrix();
      dangerMesh.setMatrixAt(i,_dd.matrix);dangerMesh.instanceMatrix.needsUpdate=true;
    }
    if(on)dangerMesh.setColorAt(i,_c);
  }
  dangerMesh.instanceColor.needsUpdate=true;
}
function updateWarnings(dt){
  const ci=idx(Math.round(P.x),Math.round(P.z));
  const inD=state==='play'&&danger[ci]<99;
  const k=inD?clamp(1-danger[ci]/FUSE,0,1):0;
  $('vign').style.opacity=inD?(0.35+0.5*k)*(0.6+0.4*Math.sin(T*(8+k*14))):0;
  $('dangerTxt').style.opacity=inD?(0.6+0.4*Math.sin(T*12)):0;
  if(bombs.length&&state==='play'){
    tickT-=dt;
    if(tickT<=0){let mn=99;for(const b of bombs)mn=Math.min(mn,b.eff);S.tick(mn<1,inD);tickT=clamp(mn*0.2,0.08,0.42);}
  }else tickT=0;
  if(inD){alarmT-=dt;if(alarmT<=0){S.alarm();alarmT=clamp(danger[ci]*0.35,0.25,0.8);}}else alarmT=0;
}
function updateCamera(dt){
  shake=Math.max(0,shake-dt*0.7);
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  if(state==='play'||state==='paused'||state==='clear'){
    const bob=Math.sin(P.bob)*0.03*P.moving;
    camera.position.set(P.x+sx,EYE+bob+sy,P.z);
    camera.rotation.set(P.pitch,P.yaw,0);
    viewBomb.visible=state==='play'&&bombs.length<P.maxBombs;
    viewBomb.position.set(VB.x+Math.cos(P.bob*0.5)*0.012*P.moving,VB.y+Math.abs(Math.sin(P.bob*0.5))*0.015*P.moving,-0.55);
    viewBomb.children[2].scale.setScalar(0.7+Math.random()*0.8);
  }else if(state==='dying'){
    const p=Math.min(1,stateT/1.2);
    camera.position.set(P.x+sx,EYE-(EYE-0.16)*p,P.z);
    camera.rotation.set(P.pitch+p*0.5,P.yaw,p*0.9);
    viewBomb.visible=false;
  }else{ // title / game over: orbit above the maze
    const a=T*0.12,cx=(W-1)/2,cz=(H-1)/2;
    camera.position.set(cx+Math.cos(a)*10,8.5,cz+Math.sin(a)*9);
    camera.lookAt(cx,0,cz);viewBomb.visible=false;
  }
}
function updateWorld(dt){
  updateBombs(dt);updateFlames(dt);updateBurn(dt);updateEnemies(dt);updateItems(dt);updateDebris(dt);updateDanger();
}
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;stateT+=dt;
  if(state==='play'){
    timeLeft-=dt;
    if(timeLeft<=30&&!timeWarned){timeWarned=true;S.timeWarn();toast('残り30秒！ 急げ！');}
    if(timeLeft<=0){timeLeft=0;killPlayer('タイムアップ！');}
    updateWorld(dt);
    if(state==='play')updatePlayer(dt);
  }else if(state==='dying'){
    updateWorld(dt);
    if(stateT>2.1)afterDeath();
  }else if(state==='clear'){
    updateItems(dt);updateDebris(dt);
    if(stateT>1.3&&!$('scr').classList.contains('on'))showClearScreen();
  }else if(state==='title'||state==='over'){
    updateEnemies(dt*0.5);updateItems(dt);
  }
  updateWarnings(dt);
  updateCamera(dt);
  renderer.render(scene,camera);
  drawMap();updateHUD();bgmTick();
}

/* ================= GAME FLOW ================= */
function killPlayer(reason){
  if(state!=='play')return;
  state='dying';stateT=0;S.miss();flash('#ff2020',0.6);shake=0.15;
  banner('MISS!',reason);exitPointer();
}
function afterDeath(){
  P.lives--;

  banner('STAGE '+stage,'残りライフ '+P.lives+'　READY!');S.start();
}
function stageClear(){
  state='clear';stateT=0;
  const bonus=1000+Math.ceil(timeLeft)*10;P.score+=bonus;P.lastBonus=bonus;saveBest();
  S.clear();flash('#7affc8',0.5);banner('STAGE CLEAR!','タイムボーナス +'+bonus);exitPointer();setPlaying(false);

function showClearScreen(){
  showScreen(`<h2>STAGE ${stage} CLEAR!</h2><p>クリアボーナス <b>+${P.lastBonus}</b></p><p>SCORE <b>${P.score}</b>　／　BEST <b>${best}</b></p><p>💣 ${P.maxBombs}　🔥 ${P.range}　👟 ${P.speedLv}　❤ ${P.lives}</p><p style="opacity:.8">次のステージは敵が増えるぞ！</p>`,

function gameOver(){

function newRun(st){

function beginStage(){

    setTimeout(()=>{if(state==='play'&&stage===1)toast('赤く光る床は爆風が届くエリア。数字は爆発までの秒数！',5000);},7500);

function pauseGame(){
  if(state!=='play')return;
  pausedFrom='play';state='paused';exitPointer();setPlaying(false);
  showScreen(`<h2>PAUSE</h2><p>STAGE ${stage}　SCORE ${P.score}</p>`+rulesHTML(),
    [{label:'つづける',fn:resumeGame},{label:'ステージをやり直す（ライフ-1）',fn:()=>{hideScreen();state='play';killPlayer('リタイア');}},{label:'タイトルへ',fn:showTitle}]);
}
function resumeGame(){if(state!=='paused')return;hideScreen();state='play';setPlaying(true);clock.getDelta();}
function showTitle(){
  state='title';stateT=0;setPlaying(false);stage=1;buildStage();
  showScreen(`<h1>BLAST MAZE 3D</h1><p class="tag">一人称ボム迷路アクション</p>`+rulesHTML()+`<p>BEST SCORE <b>${best}</b></p>`,
    [{label:'▶ ゲームスタート',fn:()=>newRun(1)}]);
}
function rulesHTML(){
  return `<div class="rules">
<b>ルール</b><br>
・ボムは約3秒で爆発し、<b>十字方向</b>に爆風が伸びる。茶色のレンガは壊せる／灰色の柱は壊せない。<br>
・<b>赤く点滅する床</b>＝爆風が届くエリア。ボムの上の数字は爆発までの秒数。チクタク音が速くなったら危険！<br>
・敵を全滅させ、レンガの下に隠れた<b>出口</b>（光の柱）に入ればステージクリア。<br>
・爆風・敵に触れる・時間切れでミス。ライフ0でゲームオーバー。<br>
・アイテム：💣ボム数+1　🔥火力+1　👟スピード+1　❤ライフ+1<br>
<b>PC</b>：<kbd>W</kbd><kbd>S</kbd>/<kbd>↑</kbd><kbd>↓</kbd>前後 <kbd>A</kbd><kbd>D</kbd>横歩き <kbd>←</kbd><kbd>→</kbd>旋回 <kbd>Q</kbd><kbd>E</kbd>90°ターン <kbd>Space</kbd>ボム <kbd>M</kbd>マップ <kbd>P</kbd>ポーズ（画面クリックでマウス視点も可）<br>
<b>スマホ</b>：左側ドラッグ＝スティック（上下で前後・左右で旋回）／右側ドラッグ＝視点／⟲⟳＝90°ターン／BOMBでボム設置／右上マップをタップで拡大
</div>`;
}
function saveBest(){if(P.score>best){best=P.score;try{localStorage.setItem('blastmaze3d_best',String(best));}catch(e){}}}
function setPlaying(on){document.body.classList.toggle('playing',on);}

/* ================= HUD ================= */
let msgTimer=0,toastTimer=0;
function banner(big,sub){$('msgBig').textContent=big;$('msgSub').textContent=sub||'';$('msg').style.opacity=1;clearTimeout(msgTimer);msgTimer=setTimeout(()=>$('msg').style.opacity=0,1900);}
function toast(t,ms){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,ms||2600);}
let flashTO=0;
function flash(col,a){const f=$('flash');f.style.transition='none';f.style.background=col;f.style.opacity=a;void f.offsetWidth;f.style.transition='opacity .45s';clearTimeout(flashTO);flashTO=setTimeout(()=>f.style.opacity=0,30);}
const hudCache={};
function setTxt(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function updateHUD(){
  setTxt('stageV',String(stage));
  setTxt('scoreV',String(P.score));
  const hs=Math.max(0,P.lives);let h='';for(let i=0;i<Math.max(3,hs);i++)h+=i<hs?'❤':'♡';
  if(hudCache.hearts!==h){hudCache.hearts=h;$('hearts').innerHTML=[...h].map(c=>c==='❤'?'<span>❤</span>':'<span class="off">❤</span>').join('');}
  setTxt('bombV',(P.maxBombs-bombs.length)+'/'+P.maxBombs);
  setTxt('fireV',String(P.range));
  setTxt('spdV',String(P.speedLv));
  setTxt('enemyV',String(aliveEnemies()));
  const ev=!exitObj||!exitObj.revealed?'未発見':exitOpen()?'開放！':'封印中';
  if(hudCache.exitV!==ev){hudCache.exitV=ev;const e=$('exitV');e.textContent=ev;e.className=ev==='未発見'?'unk':ev==='開放！'?'open':'seal';}
  const t=Math.ceil(timeLeft),ts=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  setTxt('timeV',ts);$('timeV').classList.toggle('warn',t<=30&&state==='play');
}
const mapCtx=$('map').getContext('2d');
function drawMap(){
  const m=$('map'),g=mapCtx,cs=+m.dataset.cs||10;
  g.fillStyle='#1c3a1c';g.fillRect(0,0,m.width,m.height);
  for(let z=0;z<H;z++)for(let x=0;x<W;x++){
    const i=idx(x,z),v=grid[i];
    if(v===HARD){g.fillStyle=(x===0||z===0||x===W-1||z===H-1)?'#3a3550':'#8a8fa6';g.fillRect(x*cs,z*cs,cs,cs);}
    else if(v===SOFT){g.fillStyle=burnT[i]>0?'#ff7a2a':'#a0522d';g.fillRect(x*cs+0.5,z*cs+0.5,cs-1,cs-1);}
    if(flameAt[i]>0){g.fillStyle='rgba(255,180,40,.95)';g.fillRect(x*cs,z*cs,cs,cs);}
    else if(danger[i]<99){const k=clamp(1-danger[i]/FUSE,0,1);g.fillStyle=`rgba(255,30,30,${0.3+0.45*k*(0.5+0.5*Math.sin(T*14))})`;g.fillRect(x*cs,z*cs,cs,cs);}
    const it=itemAt[i];if(it){g.fillStyle=ITEM_DEF[it.type].col;g.fillRect(x*cs+cs*0.2,z*cs+cs*0.2,cs*0.6,cs*0.6);}
  }
  if(exitObj&&exitObj.revealed){g.strokeStyle=exitOpen()?'#3fffb0':'#ff4060';g.lineWidth=Math.max(2,cs*0.2);g.strokeRect(exitObj.x*cs+2,exitObj.z*cs+2,cs-4,cs-4);}
  for(const b of bombs){g.fillStyle='#000';g.beginPath();g.arc((b.x+0.5)*cs,(b.z+0.5)*cs,cs*0.38,0,7);g.fill();g.fillStyle='#ff4040';g.beginPath();g.arc((b.x+0.5)*cs,(b.z+0.5)*cs,cs*0.15,0,7);g.fill();}
  for(const e of enemies){if(e.dying)continue;g.fillStyle='#'+ENEMY_DEF[e.type].col.toString(16).padStart(6,'0');g.beginPath();g.arc((e.x+0.5)*cs,(e.z+0.5)*cs,cs*0.34,0,7);g.fill();}
  if(state!=='title'&&state!=='over'){
    const px=(P.x+0.5)*cs,pz=(P.z+0.5)*cs,fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),a=Math.atan2(fz,fx);
    g.fillStyle='rgba(255,255,160,.22)';g.beginPath();g.moveTo(px,pz);g.arc(px,pz,cs*4,a-0.6,a+0.6);g.closePath();g.fill();
    g.save();g.translate(px,pz);g.rotate(a);g.fillStyle='#ffe14a';g.strokeStyle='#000';g.lineWidth=1;
    g.beginPath();g.moveTo(cs*0.55,0);g.lineTo(-cs*0.35,cs*0.35);g.lineTo(-cs*0.15,0);g.lineTo(-cs*0.35,-cs*0.35);g.closePath();g.fill();g.stroke();g.restore();
  }
}

/* ================= SCREENS ================= */
let screenPrimary=null;
function showScreen(html,buttons){
  $('scrBody').innerHTML=html;const bx=$('scrBtns');bx.innerHTML='';screenPrimary=null;
  buttons.forEach((b,i)=>{
    const el=document.createElement('button');el.className='btn'+(i===0?' pri':'');el.textContent=b.label;
    el.addEventListener('click',ev=>{ev.stopPropagation();unlockAudio();S.click();b.fn();});
    bx.appendChild(el);if(i===0)screenPrimary=b.fn;
  });
  $('scr').classList.add('on');
}
function hideScreen(){$('scr').classList.remove('on');screenPrimary=null;}

/* ================= INPUT ================= */
function snapTurn(dir){ // turn to the next grid-aligned heading
  const q=Math.PI/2,cur=P.yaw+P.snap;
  const target=Math.round((cur+dir*q)/q)*q;
  P.snap=target-P.yaw;
}
window.addEventListener('keydown',e=>{
  unlockAudio();
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  if(touchMode&&!e.repeat){touchMode=false;document.body.classList.remove('touch');}
  if($('scr').classList.contains('on')){
    if((e.code==='Enter'||e.code==='Space'||e.code==='NumpadEnter')&&screenPrimary&&!e.repeat){e.preventDefault();S.click();screenPrimary();}
    else if((e.code==='Escape'||e.code==='KeyP')&&state==='paused'){resumeGame();}
    return;
  }
  K[e.code]=true;
  if(e.repeat)return;
  if(state==='play'){
    if(e.code==='Space'||e.code==='Enter')placeBomb();
    if(e.code==='KeyQ')snapTurn(1);
    if(e.code==='KeyE')snapTurn(-1);
    if(e.code==='KeyP'||e.code==='Escape')pauseGame();
  }
  if(e.code==='KeyM'){mapBig=!mapBig;layoutMap();}
});
window.addEventListener('keyup',e=>{K[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in K)K[k]=false;pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
$('btnPause').addEventListener('click',e=>{e.stopPropagation();unlockAudio();if(state==='play')pauseGame();else if(state==='paused')resumeGame();});
$('map').addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();mapBig=!mapBig;layoutMap();});

/* mouse (optional pointer-lock look) */
const canvasEl=$('c');
function locked(){return document.pointerLockElement===canvasEl;}
function exitPointer(){if(locked()&&document.exitPointerLock)document.exitPointerLock();}
canvasEl.addEventListener('mousedown',e=>{
  unlockAudio();
  if(touchMode||state!=='play')return;
  if(!locked()){if(canvasEl.requestPointerLock)canvasEl.requestPointerLock();}
  else if(e.button===0)placeBomb();
  else if(e.button===2)snapTurn(-1);
});
canvasEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('mousemove',e=>{
  if(!locked()||state!=='play')return;
  P.yaw-=e.movementX*0.0022;P.pitch=clamp(P.pitch-e.movementY*0.0018,-0.7,0.35);
});
canvasEl.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&!touchMode)enableTouch();});

/* touch */
let stickId=null,stickOX=0,stickOY=0,stickX=0,stickY=0,lookId=null,lookLX=0,lookLY=0;
function enableTouch(){touchMode=true;document.body.classList.add('touch');}
if((window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window&&!(window.matchMedia&&matchMedia('(pointer:fine)').matches)))enableTouch();
const tl=$('touchLayer'),sb=$('stickBase'),sk=$('stickKnob');
tl.addEventListener('pointerdown',e=>{
  e.preventDefault();unlockAudio();
  if(e.clientX<window.innerWidth*0.5&&stickId===null){
    stickId=e.pointerId;stickOX=e.clientX;stickOY=e.clientY;stickX=stickY=0;
    sb.style.left=stickOX+'px';sb.style.top=stickOY+'px';sb.style.display='block';sk.style.transform='translate(0,0)';
  }else if(lookId===null){lookId=e.pointerId;lookLX=e.clientX;lookLY=e.clientY;}
  try{tl.setPointerCapture(e.pointerId);}catch(_){}
});
tl.addEventListener('pointermove',e=>{
  if(e.pointerId===stickId){
    const R=55;let dx=e.clientX-stickOX,dy=e.clientY-stickOY;const l=Math.hypot(dx,dy);
    if(l>R){dx*=R/l;dy*=R/l;}
    stickX=dx/R;stickY=dy/R;sk.style.transform=`translate(${dx}px,${dy}px)`;
  }else if(e.pointerId===lookId){
    if(state==='play'){P.yaw-=(e.clientX-lookLX)*0.0065;P.pitch=clamp(P.pitch-(e.clientY-lookLY)*0.005,-0.7,0.35);}
    lookLX=e.clientX;lookLY=e.clientY;
  }
});
function tEnd(e){
  if(e.pointerId===stickId){stickId=null;stickX=stickY=0;sb.style.display='none';}
  if(e.pointerId===lookId)lookId=null;
}
tl.addEventListener('pointerup',tEnd);tl.addEventListener('pointercancel',tEnd);tl.addEventListener('lostpointercapture',tEnd);
function tbtn(id,fn){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();el.classList.add('press');fn();});
  const up=()=>el.classList.remove('press');
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
tbtn('tBomb',placeBomb);
tbtn('tTL',()=>{if(state==='play')snapTurn(1);});
tbtn('tTR',()=>{if(state==='play')snapTurn(-1);});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= BOOT ================= */
function boot(){
  initThree();
  setSound(true);
  showTitle();
  requestAnimationFrame(frame);
}
</script>
<script>
// Three.js をCDNから読み込む（失敗したら別CDNで再試行、全滅なら画面に案内を表示）
(function(){
  const SRCS=[
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  let i=0;
  function next(){
    if(i>=SRCS.length){
      document.getElementById('scrBody').innerHTML='<h1>BLAST MAZE 3D</h1><p>3Dライブラリ（three.js）を読み込めませんでした。<br>インターネット接続を確認して再読み込みしてください。</p>';
      return;
    }
    const s=document.createElement('script');s.src=SRCS[i++];
    s.onload=()=>{try{boot();}catch(err){console.error(err);document.getElementById('scrBody').innerHTML='<h1>BLAST MAZE 3D</h1><p>起動エラー: '+String(err&&err.message||err)+'</p>';}};
    s.onerror=next;document.head.appendChild(s);
  }
  next();
})();
</script>
